name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:   # permite que outros workflows reutilizem (deploy-*)

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opentowork_test
          POSTGRES_USER: opentowork
          POSTGRES_PASSWORD: opentowork
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opentowork"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo, pdo_pgsql, pdo_sqlite, redis, intl, zip, gd
          coverage: none
          tools: composer:v2
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Pint (format check)
        run: vendor/bin/pint --test
      - name: PHPStan (static analysis)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Pest (tests)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: opentowork_test
          DB_USERNAME: opentowork
          DB_PASSWORD: opentowork
          REDIS_HOST: 127.0.0.1
        run: vendor/bin/pest --parallel

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test -- --run
      - run: npm run build
