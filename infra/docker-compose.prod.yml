name: opentowork-prod

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/letsencrypt:ro
      - ./nginx/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - otw
    deploy:
      resources:
        limits:
          memory: 96M

  backend:
    image: ghcr.io/mateuscasagra/open-to-work-backend:${TAG:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: postgres
      REDIS_HOST: redis
    env_file:
      - ./secrets/backend.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - otw
    deploy:
      resources:
        limits:
          memory: 768M

  frontend:
    image: ghcr.io/mateuscasagra/open-to-work-frontend:${TAG:-latest}
    restart: unless-stopped
    networks:
      - otw
    deploy:
      resources:
        limits:
          memory: 64M

  horizon:
    image: ghcr.io/mateuscasagra/open-to-work-backend:${TAG:-latest}
    restart: unless-stopped
    command: php artisan horizon
    env_file:
      - ./secrets/backend.env
    depends_on:
      - backend
      - redis
    networks:
      - otw
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q 'running'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  scheduler:
    image: ghcr.io/mateuscasagra/open-to-work-backend:${TAG:-latest}
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - ./secrets/backend.env
    depends_on:
      - backend
    networks:
      - otw
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - ./secrets/postgres.env
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - otw
    deploy:
      resources:
        limits:
          memory: 768M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - otw
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pg_data:
  redis_data:

networks:
  otw:
    driver: bridge
