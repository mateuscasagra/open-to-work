name: opentowork-dev

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: otw-backend
    working_dir: /var/www/html
    volumes:
      - ../backend:/var/www/html
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      AWS_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: otw-postgres
    environment:
      POSTGRES_DB: opentowork
      POSTGRES_USER: opentowork
      POSTGRES_PASSWORD: opentowork
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentowork"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: otw-redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: otw-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: opentowork
      MINIO_ROOT_PASSWORD: opentowork_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: otw-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
